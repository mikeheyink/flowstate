<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              display: ['"Hanken Grotesk"', 'Inter', 'sans-serif'],
            },
            colors: {
              // Cool neutral ramp with a faint blue undertone — "North Light"
              // (previous theme: warm beige "Calm Focus"; swap this block back to revert)
              slate: {
                50:  '#F5F6F8',
                100: '#ECEEF2',
                200: '#E0E3E9',
                300: '#C6CAD4',
                400: '#9EA3B0',
                500: '#7E8391',
                600: '#616674',
                700: '#494E59',
                800: '#30343E',
                850: '#22252D',
                900: '#181B21',
                950: '#121419',
              },
              // Brand — iris / indigo (interactive, focus, ⌘K)
              primary: {
                400: '#8C95EE',
                500: '#6674E4',
                600: '#4F5CD1',
              },
              // Signature success color — reserved for completion ONLY
              success: {
                400: '#2BC98A',
                500: '#15A66A',
                600: '#0E8A57',
              },
            },
            animation: {
              'toast-in': 'toastIn 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
              'toast-out': 'toastOut 0.2s ease-in forwards',
            },
            keyframes: {
              toastIn: {
                '0%': { transform: 'translateY(100%)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              },
              toastOut: {
                '0%': { transform: 'translateY(0)', opacity: 1 },
                '100%': { transform: 'translateY(20px)', opacity: 0 },
              },
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar to match the "Pro" aesthetic */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #C6CAD4;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9EA3B0;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #30343E;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #494E59;
      }
      body {
        background-color: #F5F6F8; /* Porcelain — light mode */
        color: #1A1C22;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden; /* App-like feel */
      }
      html.dark body {
        background-color: #121419; /* Blue-charcoal near-black */
        color: #E9EBF0;
      }
    </style>
  <script type="importmap">

  }
}
</script>
