<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowState To-Do</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#151e2e',
                900: '#0f172a',
                950: '#020617',
              },
              primary: {
                500: '#6366f1',
                600: '#4f46e5',
              }
            },
            animation: {
              'toast-in': 'toastIn 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
              'toast-out': 'toastOut 0.2s ease-in forwards',
            },
            keyframes: {
              toastIn: {
                '0%': { transform: 'translateY(100%)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              },
              toastOut: {
                '0%': { transform: 'translateY(0)', opacity: 1 },
                '100%': { transform: 'translateY(20px)', opacity: 0 },
              },
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar to match the "Pro" aesthetic */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      body {
        background-color: #f8fafc; /* Slate 50 for light mode default */
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden; /* App-like feel */
      }
      html.dark body {
        background-color: #020617; /* Slate 950 */
        color: #e2e8f0;
      }
    </style>
